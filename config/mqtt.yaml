broker: "192.168.1.10"
port: 1883
topic_prefix: "eam"  # Topics: eam/{device_id}/events, /alerts, /heartbeat, /hourly
qos: 1
connection_timeout: 5

# Authentication (credentials via env vars: EAM_MQTT_USERNAME / EAM_MQTT_PASSWORD)
use_authentication: true

# TLS/SSL Configuration (enable for production)
# Set use_tls: true and provide certificate paths for encrypted MQTT
use_tls: false  # Set to true for production (port changes to 8883 automatically)
tls:
  ca_cert: null      # Path to CA certificate (e.g., /opt/eam/certs/ca.crt)
  client_cert: null   # Path to client certificate (optional, for mutual TLS)
  client_key: null    # Path to client private key (optional, for mutual TLS)
  tls_version: "tlsv1.2"  # Minimum TLS version
  insecure: false     # Set to true to skip hostname verification (self-signed certs only)

# Alert deduplication — same alert type is suppressed for this window (seconds)
# Prevents Flink from processing 15 identical alerts/sec when condition persists
alert_dedup_seconds: 30.0

# MQTT Broker Configuration (server-side — documented here for reference)
# These must be configured on the EMQX/HiveMQ broker, not the client.
broker_retention:
  persistent_session: true
  message_retention_seconds: 86400  # 24 hours
  max_queued_messages: 1000
  clean_session: false
