# config/security.yaml
# Camera Security Configuration
# Clinical-grade access control and audit logging
#
# IMPORTANT: Generate password hashes before deployment:
#   python3 -c "import hashlib; print(hashlib.sha256(b'YOUR_PASSWORD').hexdigest())"
#
# Or use the secure config generator:
#   python3 -m security.secure_config --generate-credentials

# Authorized users - REPLACE HASHES BEFORE PRODUCTION
authorized_users:
  admin:
    password_hash: "88ed7b377f301cfe652a345fed03cf3405c6f27bf69298d836fc85c06201d951"  # test_admin_2026 — CHANGE FOR PRODUCTION
    role: "admin"
    permissions: ["read", "write", "admin"]

  nurse:
    password_hash: "88ed7b377f301cfe652a345fed03cf3405c6f27bf69298d836fc85c06201d951"  # test_admin_2026 — CHANGE FOR PRODUCTION
    role: "nurse"
    permissions: ["read", "write"]

  viewer:
    password_hash: "88ed7b377f301cfe652a345fed03cf3405c6f27bf69298d836fc85c06201d951"  # test_admin_2026 — CHANGE FOR PRODUCTION
    role: "viewer"
    permissions: ["read"]

# Session settings
session:
  max_age_seconds: 3600  # 1 hour
  cleanup_interval_seconds: 300  # 5 minutes

# Encryption settings
encryption:
  key_file: "storage/.encryption_key"
  key_permissions: 0o600  # Read/write for owner only (Unix)

# Audit logging
audit:
  log_path: "logs/security_audit.log"
  log_rotation: true
  max_log_size_mb: 100

# Security policies
policies:
  require_authentication: true  # Require authentication for camera access
  encrypt_frames: false  # Frame encryption (can impact performance)
  log_all_access: true  # Log all resource access
  lockout_after_failed_attempts: 5  # Lockout after N failed attempts
  lockout_duration_seconds: 300  # 5 minutes
