<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Patient Monitoring Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .alert-banner {
            background: #dc3545;
            color: white;
            padding: 15px 30px;
            font-weight: 600;
            text-align: center;
            animation: pulse 2s infinite;
            display: none;
        }
        
        .alert-banner.show {
            display: block;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 120px);
        }
        
        .sidebar {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .patient-card {
            background: #252b4a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
        }
        
        .patient-card:hover {
            transform: translateX(5px);
            background: #2d3455;
        }
        
        .patient-card.active {
            border-left-color: #28a745;
            background: #2d3455;
        }
        
        .patient-card.high-risk {
            border-left-color: #dc3545;
        }
        
        .patient-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .patient-status {
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .risk-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .risk-high {
            background: #dc3545;
            color: white;
        }
        
        .risk-medium {
            background: #ffc107;
            color: #000;
        }
        
        .risk-low {
            background: #28a745;
            color: white;
        }
        
        .main-content {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        
        .alert-panel {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .alert-item {
            background: #252b4a;
            border-left: 4px solid #dc3545;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .alert-item.medium {
            border-left-color: #ffc107;
        }
        
        .alert-item.low {
            border-left-color: #28a745;
        }
        
        .alert-time {
            font-size: 11px;
            color: #a0a0a0;
        }
        
        .btn-acknowledge {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-acknowledge:hover {
            background: #5568d3;
        }
        
        .patient-dashboard {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 30px;
            overflow-y: auto;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #252b4a;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .status-label {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
        
        .status-value {
            font-size: 32px;
            font-weight: 600;
        }
        
        .chart-container {
            background: #252b4a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            height: 300px;
        }
        
        .timeline {
            background: #252b4a;
            border-radius: 8px;
            padding: 20px;
        }
        
        .timeline-item {
            border-left: 2px solid #667eea;
            padding-left: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
        }
        
        .timeline-time {
            font-size: 11px;
            color: #a0a0a0;
            margin-bottom: 5px;
        }
        
        .timeline-event {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 Clinical Patient Monitoring Dashboard</h1>
    </div>
    
    <div class="alert-banner" id="alertBanner">
        <span id="alertBannerText">CRITICAL ALERT: Immediate attention required!</span>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <h3 style="margin-bottom: 15px;">Patients</h3>
            <div id="patientList"></div>
        </div>
        
        <div class="main-content">
            <div class="alert-panel">
                <h3 style="margin-bottom: 15px;">Active Alerts</h3>
                <div id="alertList"></div>
            </div>
            
            <div class="patient-dashboard" id="patientDashboard">
                <h2 id="selectedPatientName">Select a patient to view details</h2>
                <div id="patientContent"></div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let selectedPatientId = null;
        let charts = {};
        
        // Load patients on startup
        loadPatients();
        loadAlerts();
        
        // Set up real-time updates
        socket.on('new_alert', (data) => {
            showAlertBanner(data.alert);
            loadAlerts();
        });
        
        socket.on('alert_acknowledged', (data) => {
            loadAlerts();
        });
        
        function loadPatients() {
            fetch('/api/patients')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('patientList');
                    list.innerHTML = '';
                    
                    data.patients.forEach(patient => {
                        const card = document.createElement('div');
                        card.className = 'patient-card';
                        if (patient.risk_score?.current_risk === 'HIGH') {
                            card.classList.add('high-risk');
                        }
                        if (patient.patient_id === selectedPatientId) {
                            card.classList.add('active');
                        }
                        
                        const riskClass = patient.risk_score?.current_risk?.toLowerCase() || 'low';
                        card.innerHTML = `
                            <div class="patient-name">${patient.patient_id || 'Unknown'}</div>
                            <div class="patient-status">Bed: ${patient.bed_id || 'N/A'}</div>
                            <span class="risk-badge risk-${riskClass}">${patient.risk_score?.current_risk || 'LOW'} RISK</span>
                        `;
                        
                        card.onclick = () => selectPatient(patient.patient_id);
                        list.appendChild(card);
                    });
                });
        }
        
        function loadAlerts() {
            fetch('/api/alerts')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('alertList');
                    list.innerHTML = '';
                    
                    if (data.unacknowledged.length === 0) {
                        list.innerHTML = '<p style="color: #a0a0a0; text-align: center;">No active alerts</p>';
                        return;
                    }
                    
                    data.unacknowledged.slice(0, 5).forEach(alert => {
                        const item = document.createElement('div');
                        item.className = `alert-item ${alert.alert_level.toLowerCase().replace('_', '-')}`;
                        
                        const time = new Date(alert.ts * 1000).toLocaleTimeString();
                        item.innerHTML = `
                            <div>
                                <div style="font-weight: 600;">${alert.alert_level} - ${alert.label || 'Alert'}</div>
                                <div class="alert-time">${time}</div>
                            </div>
                            <button class="btn-acknowledge" onclick="acknowledgeAlert(${alert.id})">Acknowledge</button>
                        `;
                        list.appendChild(item);
                    });
                });
        }
        
        function selectPatient(patientId) {
            selectedPatientId = patientId;
            loadPatients();
            loadPatientDashboard(patientId);
        }
        
        function loadPatientDashboard(patientId) {
            document.getElementById('selectedPatientName').textContent = `Patient: ${patientId}`;
            
            fetch(`/api/patient/${patientId}/status`)
                .then(r => r.json())
                .then(data => {
                    const content = document.getElementById('patientContent');
                    content.innerHTML = `
                        <div class="status-grid">
                            <div class="status-card">
                                <div class="status-label">Current Activity</div>
                                <div class="status-value">${data.current_status?.activity || 'Unknown'}</div>
                            </div>
                            <div class="status-card">
                                <div class="status-label">Posture</div>
                                <div class="status-value">${data.current_status?.posture || 'Unknown'}</div>
                            </div>
                            <div class="status-card">
                                <div class="status-label">Confidence</div>
                                <div class="status-value">${(data.current_status?.confidence * 100 || 0).toFixed(0)}%</div>
                            </div>
                        </div>
                        
                        <h3 style="margin-bottom: 15px;">Risk Forecast</h3>
                        <div class="status-card" style="text-align: left;">
                            <div style="margin-bottom: 10px;">
                                <strong>Risk Level:</strong> 
                                <span class="risk-badge risk-${data.risk_forecast?.risk_level?.toLowerCase() || 'low'}">
                                    ${data.risk_forecast?.risk_level || 'UNKNOWN'}
                                </span>
                            </div>
                            <div style="margin-bottom: 10px;">
                                <strong>Confidence:</strong> ${(data.risk_forecast?.confidence * 100 || 0).toFixed(0)}%
                            </div>
                            <div>
                                <strong>Forecasted Events:</strong> ${data.risk_forecast?.forecasted_events?.length || 0}
                            </div>
                        </div>
                        
                        <h3 style="margin: 30px 0 15px 0;">Recent Activity Timeline</h3>
                        <div class="timeline">
                            ${data.timeline?.slice(0, 10).map(event => `
                                <div class="timeline-item">
                                    <div class="timeline-time">${new Date(event.ts * 1000).toLocaleString()}</div>
                                    <div class="timeline-event">${event.label || 'Unknown activity'}</div>
                                </div>
                            `).join('') || '<p style="color: #a0a0a0;">No recent activity</p>'}
                        </div>
                    `;
                });
        }
        
        function acknowledgeAlert(alertId) {
            fetch(`/api/alerts/${alertId}/acknowledge`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        loadAlerts();
                    }
                });
        }
        
        function showAlertBanner(alert) {
            const banner = document.getElementById('alertBanner');
            const text = document.getElementById('alertBannerText');
            text.textContent = `${alert.alert_level}: ${alert.label || 'Alert'} - Immediate attention required!`;
            banner.classList.add('show');
            
            setTimeout(() => {
                banner.classList.remove('show');
            }, 10000);
        }
        
        // Auto-refresh
        setInterval(() => {
            if (selectedPatientId) {
                loadPatientDashboard(selectedPatientId);
            }
            loadPatients();
            loadAlerts();
        }, 5000);
    </script>
</body>
</html>
