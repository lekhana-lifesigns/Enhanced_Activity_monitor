# Enhanced Activity Monitor - EMQX ACL Rules
# Each device can only publish to its own eam/{device_id}/* topics.
# Flink consumers can subscribe to all topics (shared subscriptions).

# Rule format: {allow|deny, {username|clientid|ipaddr|all}, {publish|subscribe|all}, [topics]}

# ── Edge devices: publish only to their own topics ──
# Device client_id must match the topic device_id segment.
# Pattern: %c = client_id
{allow, {clientid, {re, "^bed_\\d+$"}}, publish, ["eam/%c/events", "eam/%c/alerts", "eam/%c/heartbeat", "eam/%c/hourly"]}.

# ── Flink consumers: subscribe to all device topics ──
{allow, {username, "flink"}, subscribe, ["$share/flink/eam/+/events", "$share/flink/eam/+/alerts", "$share/flink/eam/+/heartbeat", "$share/flink/eam/+/hourly"]}.

# ── API backend: subscribe to alerts + publish ward alerts ──
{allow, {username, "api_backend"}, subscribe, ["eam/+/alerts", "eam/ward/+/alerts"]}.
{allow, {username, "api_backend"}, publish, ["eam/ward/+/alerts"]}.

# ── Dashboard: subscribe to events + alerts (WebSocket) ──
{allow, {username, "dashboard"}, subscribe, ["eam/+/events", "eam/+/alerts", "eam/ward/+/alerts"]}.

# ── Grafana: subscribe to all (monitoring) ──
{allow, {username, "grafana"}, subscribe, ["eam/#"]}.

# ── Deny everything else ──
{deny, all, all, ["#"]}.
