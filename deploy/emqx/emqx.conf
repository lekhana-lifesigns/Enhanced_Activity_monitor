# Enhanced Activity Monitor - EMQX Broker Configuration
# Replaces Mosquitto for 1000+ device scale.
# EMQX supports shared subscriptions, built-in auth, and clustering.

# ============================================
# Node
# ============================================
node {
    name = "emqx@emqx.eam.local"
    cookie = "eam_emqx_secret_cookie"
    data_dir = "/opt/emqx/data"
}

# ============================================
# Listeners
# ============================================

# MQTT TCP (internal, Flink consumers)
listeners.tcp.default {
    bind = "0.0.0.0:1883"
    max_connections = 10000
    proxy_protocol = false
}

# MQTT TLS (edge devices)
listeners.ssl.default {
    bind = "0.0.0.0:8883"
    max_connections = 10000
    ssl_options {
        cacertfile = "/opt/emqx/etc/certs/ca.crt"
        certfile = "/opt/emqx/etc/certs/server.crt"
        keyfile = "/opt/emqx/etc/certs/server.key"
        verify = verify_none
        versions = ["tlsv1.3", "tlsv1.2"]
    }
}

# WebSocket (dashboard, Grafana live)
listeners.ws.default {
    bind = "0.0.0.0:8083"
    max_connections = 1000
}

# WebSocket TLS
listeners.wss.default {
    bind = "0.0.0.0:8084"
    max_connections = 1000
    ssl_options {
        cacertfile = "/opt/emqx/etc/certs/ca.crt"
        certfile = "/opt/emqx/etc/certs/server.crt"
        keyfile = "/opt/emqx/etc/certs/server.key"
    }
}

# ============================================
# MQTT Protocol
# ============================================
mqtt {
    max_packet_size = 1MB
    max_clientid_len = 128
    max_topic_levels = 10
    max_qos_allowed = 2
    max_topic_alias = 65535
    retain_available = true

    # Session persistence for Flink consumers
    max_mqueue_len = 10000
    mqueue_default_priority = lowest
    max_inflight = 100

    # Keepalive
    keepalive_multiplier = 1.5
}

# ============================================
# Authentication (password-based for edge devices)
# ============================================
authentication = [
    {
        mechanism = password_based
        backend = built_in_database
        password_hash_algorithm {
            name = bcrypt
            salt_rounds = 10
        }
    }
]

# ============================================
# Authorization (ACL - topic-level access control)
# ============================================
authorization {
    no_match = deny
    deny_action = disconnect
    sources = [
        {
            type = built_in_database
        },
        {
            type = file
            path = "/opt/emqx/etc/acl.conf"
        }
    ]
}

# ============================================
# Dashboard (EMQX management UI)
# ============================================
dashboard {
    listeners.http {
        bind = "0.0.0.0:18083"
    }
    default_username = "admin"
    default_password = "${EMQX_DASHBOARD_PASSWORD:-admin_changeme}"
}

# ============================================
# Logging
# ============================================
log {
    file {
        enable = true
        level = info
        path = "/opt/emqx/log/emqx.log"
        rotation_count = 10
        rotation_size = 50MB
    }
    console {
        enable = true
        level = warning
    }
}

# ============================================
# Metrics & Monitoring
# ============================================
prometheus {
    push_gateway_server = ""
    enable = true
}

# ============================================
# Shared Subscriptions (for Flink load balancing)
# ============================================
# Flink TaskManagers subscribe as:
#   $share/flink/eam/+/events    -> load-balanced across TaskManagers
#   $share/flink/eam/+/alerts    -> load-balanced across TaskManagers
#   $share/flink/eam/+/heartbeat -> load-balanced across TaskManagers
#   $share/flink/eam/+/hourly    -> load-balanced across TaskManagers
#
# This ensures each message is processed by exactly one Flink slot.
# EMQX supports shared subscriptions natively (no plugin needed).

# ============================================
# Session Persistence
# ============================================
# Persistent sessions keep messages for disconnected Flink consumers.
# Combined with QoS 1, this gives at-least-once delivery guarantees.
durable_sessions {
    enable = true
    # Keep session state for disconnected clients (24 hours)
    heartbeat_interval = 5000ms
    session_gc_interval = 600s
}

# ============================================
# Rate Limiting (prevent device flood)
# ============================================
limiter {
    # Per-client publish rate: max 20 msg/sec (device sends 1-2/sec normally)
    client.publish {
        rate = "20/s"
        burst = 50
    }
    # Global: max 50K msg/sec across all clients
    global.publish {
        rate = "50000/s"
        burst = 100000
    }
}
