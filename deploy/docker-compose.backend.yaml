version: '3.8'

services:
  # ============================================
  # API Backend
  # ============================================
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: eam-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://eam:${POSTGRES_PASSWORD}@timescaledb:5432/eam
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eam-network
    volumes:
      - api-logs:/app/logs

  # ============================================
  # TimescaleDB (replaces plain PostgreSQL)
  # Time-series optimized for device metrics at scale
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: eam-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eam
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eam
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eam -d eam"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eam-network
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB

  # ============================================
  # Redis (Caching & Rate Limiting)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: eam-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eam-network
    ports:
      - "6379:6379"

  # ============================================
  # EMQX MQTT Broker (replaces Mosquitto)
  # Supports shared subscriptions, 10M+ connections, built-in auth
  # ============================================
  emqx:
    image: emqx/emqx:5.4
    container_name: eam-emqx
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=emqx.eam.local
      - EMQX_DASHBOARD_PASSWORD=${EMQX_DASHBOARD_PASSWORD:-admin_changeme}
      - EMQX_LOADED_PLUGINS=emqx_prometheus
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - "1883:1883"     # MQTT TCP
      - "8883:8883"     # MQTT TLS
      - "8083:8083"     # MQTT WebSocket
      - "8084:8084"     # MQTT WebSocket TLS
      - "18083:18083"   # EMQX Dashboard
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - eam-network

  # ============================================
  # Apache Flink JobManager
  # Coordinates Flink jobs (windowed aggregation, alert enrichment,
  # cross-device correlation)
  # ============================================
  flink-jobmanager:
    image: flink:1.18-java11
    container_name: eam-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60s
        execution.checkpointing.mode: EXACTLY_ONCE
        rest.flamegraph.enabled: true
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=flink
      - MQTT_PASSWORD=${FLINK_MQTT_PASSWORD}
      - TIMESCALE_URL=postgresql://eam:${POSTGRES_PASSWORD}@timescaledb:5432/eam
      - NURSE_CALL_API=${NURSE_CALL_API}
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ../flink/jobs:/opt/flink/usrlib/jobs:ro
    ports:
      - "8081:8081"     # Flink Web UI
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - eam-network

  # ============================================
  # Apache Flink TaskManager(s)
  # Executes Flink job slots (scale with replicas)
  # ============================================
  flink-taskmanager:
    image: flink:1.18-java11
    container_name: eam-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2g
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=flink
      - MQTT_PASSWORD=${FLINK_MQTT_PASSWORD}
      - TIMESCALE_URL=postgresql://eam:${POSTGRES_PASSWORD}@timescaledb:5432/eam
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ../flink/jobs:/opt/flink/usrlib/jobs:ro
    depends_on:
      - flink-jobmanager
    networks:
      - eam-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================
  # Nginx API Gateway
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: eam-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - eam-network

  # ============================================
  # Prometheus (Metrics Collection)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eam-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - eam-network

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: eam-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - timescaledb
    networks:
      - eam-network

# ============================================
# Networks
# ============================================
networks:
  eam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  timescaledb-data:
  redis-data:
  emqx-data:
  emqx-log:
  flink-checkpoints:
  flink-savepoints:
  api-logs:
  nginx-logs:
  prometheus-data:
  grafana-data:
